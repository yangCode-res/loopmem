[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopmem-core"
version = "0.1.0"
description = "Research-loop memory management for long-horizon agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
models = [
    "torch>=2.5,<3",
    "transformers>=4.56,<5",
    "peft>=0.13,<1",
    "accelerate>=1,<2",
]

[tool.setuptools]
packages = ["loopmem", "training"]
package-dir = {loopmem = "src/loopmem", training = "training"}
